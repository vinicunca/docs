name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: pnpm i --frozen-lockfile

      - name: Build
        shell: bash
        run: pnpm run generate

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.152.0 deploy

      - name: Check the live docs
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 --output /dev/null https://vinicunca.dev/
          curl --fail --silent --show-error --retry 3 --max-time 20 --output /dev/null https://vinicunca.dev/llms.txt
