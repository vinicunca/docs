ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - synckit@0.9.3
  - semver@6.3.1
  - chokidar@4.0.3

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

allowBuilds:
  esbuild: true
  sharp: true
  better-sqlite3: true
  vue-demi: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - better-sqlite3

overrides:
  # @nuxt/image 2.1 pulls ipx 4 beta, whose second sharp kills the prerender at /_ipx
  '@nuxt/image': 2.0.0

