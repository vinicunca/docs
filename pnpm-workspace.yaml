ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

overrides:
  # @nuxt/image 2.1 pulls ipx 4 beta, whose second sharp kills the prerender at /_ipx
  '@nuxt/image': 2.1.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - better-sqlite3

